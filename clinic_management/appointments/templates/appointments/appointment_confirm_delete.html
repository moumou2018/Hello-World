{% extends 'base.html' %}

{% block content %}
<h1>Delete Appointment</h1>
<p>Are you sure you want to delete the appointment for {{ appointment.patient }} on {{ appointment.appointment_date|date:"Y-m-d H:i" }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'appointments:appointment_detail' appointment.pk %}">Cancel</a>
{% endblock %}
