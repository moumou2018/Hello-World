{% extends 'base.html' %}

{% block content %}
<h1>{% if view.kwargs.pk %}Edit Invoice{% else %}Add New Invoice{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'finance:invoice_list' %}">Cancel</a>
{% endblock %}
