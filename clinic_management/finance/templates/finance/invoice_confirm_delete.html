{% extends 'base.html' %}

{% block content %}
<h1>Delete Invoice</h1>
<p>Are you sure you want to delete Invoice #{{ invoice.pk }} for {{ invoice.patient }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'finance:invoice_detail' invoice.pk %}">Cancel</a>
{% endblock %}
